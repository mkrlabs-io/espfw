[project]
name = "espfw"
version = "0.1.0"
description = "ESP32 firmware inspector and corpus symbol matcher"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MKR Labs AS", email = "contact@mkrlabs.io" }]
dependencies = []

[project.scripts]
espfw = "espfw.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["espfw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "SIM", "C4", "UP", "RUF", "ARG", "ISC"]
ignore = ["E501", "ISC001"]
